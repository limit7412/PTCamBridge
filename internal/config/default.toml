## PTCamBridge の設定
##
## このファイルは初回起動時に %APPDATA%\PTCamBridge\ptcambridge.toml へ
## そのまま書き出されます。リポジトリ内のこのファイルは、生成される中身と
## 同一であることをテストで保証しています。
##
## 優先順位: コマンドライン引数 > 環境変数 (PTCAMBRIDGE_*) > このファイル > 既定値
##
## ▼ はじめに: 既定では UVC カメラを使う設定になっていますが、カメラ名が
##    空なので、そのままでは起動しません。下の [source.uvc] device を
##    設定してください。有線ボードや WiFi カメラを使う場合は
##    [source] type を "serial" / "mjpeg" に変えてください。

[server]
# 待受アドレス。既定はループバックのみで、LAN 公開はオプトインです。
# ループバック以外にバインドすると管理 API (/api/v1/*) は自動的に無効になります。
#
# ポート 0 (OS に空きポートを選ばせる) は指定できません。起動ごとにアドレスが
# 変わるためクライアントのキャッシュがすぐ古くなり、bind が二重起動の抑止
# (ポートがこのアプリの識別子) としても機能しなくなるためです。`00` や `+0`、
# ポートを省略した `127.0.0.1:` も同じ扱いです。ポートは 1〜65535 の数値で
# 指定してください (サービス名は不可)。
listen = "127.0.0.1:18080"

# multipart の boundary 文字列。
# PaperTracker クライアントはクローズドソースでバージョンにより
# パーサーの挙動が異なるため、再ビルドなしで調整できるようにしています。
boundary = "ptcambridge"

# 各パートに追加するヘッダ。上と同じ理由で用意しています。
# [server.extra_headers]
# X-Timestamp = "0"

# ソース切断中もストリーム接続を維持するかどうか。
# false だと接続を切ってクライアント側の再接続を促します。
# 短い瞬断であれば維持したほうが復帰が速くなります。
hold_on_source_loss = false

[source]
# "uvc" | "serial" | "mjpeg"
type = "uvc"

# 1 フレームの上限バイト数。0 で既定値 (4 MiB)。
max_frame_size = 0

[source.uvc]
# 使用するカメラ。type = "uvc" のとき必須で、空のままでは起動しません。
#
# 名前は `ptcambridge.exe -list-devices` で確認できます。Windows は
# DirectShow のフレンドリ名 (例: "Bigeye")、Linux は /dev/video* のパスです。
# 同名のカメラが複数ある場合や、再起動でフレンドリ名が変わる環境では、
# -list-devices が併記する "@device_pnp_..." の方を指定すると安定します。
device = ""
# 解像度。空でカメラ既定値。
#
# 空を既定にしているのは、指定した値をカメラが持っていなければ、そのカメラが
# 一切開かないためです。Windows の DirectShow は要求したモードが無いと
# "Could not set video options" で入力を開けず、再試行しても毎回同じ場所で
# 落ちます。空にしておけば、カメラが自分の既定モードを選びます。それは
# どのカメラにも必ず存在します。
#
# Babble や EyeTrackVR のボードを使う場合は size = "240x240"、framerate = 30 を
# 書いてください。
#
# 自分のカメラが持っているモードを調べるには、ffmpeg に直接訊きます。
# カメラ名は ptcambridge.exe -list-devices で確認できます。
# トレイの「Get ffmpeg」で取得した ffmpeg.exe は PATH に入らないので、
# 場所を含めて実行してください。
#
#   "%APPDATA%\PTCamBridge\bin\ffmpeg.exe" -hide_banner -f dshow -list_options true -i video="カメラ名"
size = ""
# フレームレート。0 でデバイス既定値。負数は設定ミスとして起動時に拒否します。
# size と同じ理由で、既定は 0 です。
framerate = 0
# 空なら実行ファイルと同じフォルダの ffmpeg.exe、次に PATH、最後にトレイの
# 「Get ffmpeg」で取得した %APPDATA%\PTCamBridge\bin\ffmpeg.exe を探します。
# ここで指定したものが常に優先されます。
ffmpeg_path = ""

[source.serial]
# "COM5" のような固定指定、または "auto" で VID による自動探索。
# "auto" は既知の VID を持つポートを順に試し、再接続のたびに次の候補へ移ります。
# 既知の VID が 1 つも無い場合に限り、ポートが 1 本だけならそれを試します
# (カメラボードとは限らないので、その旨をログに出します)。
port = "auto"
# 0 で既定値 (3000000)。負数は設定ミスとして起動時に拒否します。
baud = 3000000
# パケットのプリアンブル。ファームウェアのバージョン差を
# コード変更なしで吸収するために設定可能にしています。
header = [0xFF, 0xA0, 0xFF, 0xA1]

[source.mjpeg]
# type = "mjpeg" のとき必須。例: "http://192.168.1.50/"
url = ""

[transform]
# すべて既定値のままなら変換は行わず、入力 JPEG をバイト列のまま転送します
# (再エンコードによる画質劣化と CPU 消費を避けるため)。
rotate = 0          # 0 / 90 / 180 / 270 (時計回り)
flip_h = false
flip_v = false
crop_square = false
reencode_quality = 0 # 0 = 再エンコードなし、1-100 で品質指定

[papertracker]
# PaperTracker クライアントのインストールフォルダ。
# write_cache を有効にすると起動時に wifi_cache.txt を本アプリ宛に書き換えます。
# 元の内容は wifi_cache.txt.ptcambridge-backup へ (初回のみ) 退避し、
# write_cache を false に戻して起動すると書き戻します。
install_dir = ""
write_cache = false

[ui]
# 画面に出る文字の言語。"auto" | "en" | "ja"
# auto は OS の表示言語に従います (Windows 以外では LANG などの環境変数)。
# ログは対象外で常に英語です。不具合報告にそのまま貼れる方が有用なためです。
language = "auto"

[log]
level = "info"      # debug / info / warn / error
dir = ""            # 空なら %APPDATA%\PTCamBridge\logs
