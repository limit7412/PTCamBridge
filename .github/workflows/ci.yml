name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet (windows)
        env:
          GOOS: windows
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      # The release artefact is a cgo-free single executable, so the build that
      # matters is this one rather than the host build.
      - name: Build for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.Version=${GITHUB_SHA::7}" -o paperbridge.exe ./cmd/paperbridge

      - uses: actions/upload-artifact@v4
        with:
          name: paperbridge-windows-amd64
          path: paperbridge.exe
